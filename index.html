<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AkudanGuru — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#004AAD; --pri-d:#00337A; --pri-50:#E6EEFA; --pri-100:#CCDCF4;
  --yellow:#FABC09; --yellow-d:#C48F00; --yellow-50:#FFF6D6;
  --green:#18A058; --green-50:#DDF7E8;
  --blue:#0891B2; --blue-50:#DCF3F8;
  --purple:#7A4BD8; --purple-50:#EEE6FF;
  --orange:#FF8A3D; --orange-50:#FFEBDD;
  --red:#E5484D; --red-50:#FDECEC;
  --ink:#14213D; --ink-2:#4A5675; --muted:#8590A8; --line:#E2E9F3;
  --bg:#F4F7FC; --card:#FFFFFF;
  --r:18px; --r-sm:12px;
  --shadow:0 2px 0 rgba(20,33,61,.04), 0 8px 24px -12px rgba(0,74,173,.18);
  --font-h:'Lexend', 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-b:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;line-height:1.2;letter-spacing:.1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--pri);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.row>.row{max-width:100%;min-width:0}.row>.tabs{min-width:0;max-width:100%}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}.g2:not(.keep){grid-template-columns:1fr}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--pri);color:#fff;box-shadow:0 3px 0 var(--pri-d);transition:transform .08s, filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pri-d)}
.btn svg{width:17px;height:17px}
.btn.sm{padding:6px 12px;font-size:13px;box-shadow:0 2px 0 var(--pri-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 var(--yellow-d)}
.btn.green{background:var(--green);box-shadow:0 3px 0 #0E7A41}
.btn.wa{background:#25D366;box-shadow:0 3px 0 #179C4A}
.btn.red{background:var(--red);box-shadow:0 3px 0 #B4282D}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--pri-50);color:var(--pri)}
.icon-btn svg{width:20px;height:20px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-50)}
textarea.input{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #E3EBF6;padding:18px}
.card h3{font-size:18px;margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.stat .val{font-family:var(--font-h);font-size:26px;font-weight:600;line-height:1.1}
.stat .sub{font-size:12px;color:var(--ink-2)}
.bg-pri{background:var(--pri-50)} .bg-yellow{background:var(--yellow-50)} .bg-green{background:var(--green-50)} .bg-blue{background:var(--blue-50)} .bg-purple{background:var(--purple-50)} .bg-orange{background:var(--orange-50)} .bg-red{background:var(--red-50)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-green{background:var(--green-50);color:#0E7A41}
.b-red{background:var(--red-50);color:#B4282D}
.b-yellow{background:var(--yellow-50);color:#8A6500}
.b-blue{background:var(--blue-50);color:#0B6A82}
.b-pri{background:var(--pri-50);color:var(--pri-d)}
.b-purple{background:var(--purple-50);color:#5B32B0}
.b-gray{background:#F1EFF5;color:var(--ink-2)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.unpaid td{background:#FFF4F4}
.t tr.unpaid td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.t .c{text-align:center}
.t .r{text-align:right}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff}
.photo{border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--pri-50)}
.mc{display:grid;gap:9px}
.mc button{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--line)}
.mc button b{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--pri-50);color:var(--pri);flex-shrink:0;font-family:var(--font-h)}
.mc button:hover{border-color:var(--pri-100)}
.mc button.right{background:var(--green-50);border-color:var(--green)}.mc button.right b{background:var(--green);color:#fff}
.mc button.wrong{background:var(--red-50);border-color:var(--red)}.mc button.wrong b{background:var(--red);color:#fff}
.skillbar{display:flex;align-items:center;gap:10px;margin:5px 0}
.skillbar span{width:120px;font-weight:700;font-size:13px}
.skillbar i{flex:1;height:10px;border-radius:9px;background:var(--pri-50);position:relative;overflow:hidden}
.skillbar i em{position:absolute;inset:0 auto 0 0;background:var(--pri);border-radius:9px}
.skillbar b{width:34px;text-align:right;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;font-weight:800;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(circle at 12% 18%, var(--yellow-50) 0 120px, transparent 121px),
  radial-gradient(circle at 88% 82%, var(--blue-50) 0 160px, transparent 161px),
  radial-gradient(circle at 90% 10%, var(--pri-100) 0 90px, transparent 91px), var(--bg)}
.login-card{width:100%;max-width:410px;background:#fff;border-radius:28px;padding:28px 24px;box-shadow:0 20px 50px -24px rgba(0,74,173,.45);text-align:center}
.login-card .logo{width:132px;height:132px;margin:-4px auto 8px;display:block}
.login-card h1{font-size:24px}
.login-card .tabs{margin:18px 0 16px;justify-content:center}
.login-card .tabs button{flex:1}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.demo-box{margin-top:16px;background:var(--yellow-50);border-radius:14px;padding:10px 12px;font-size:12.5px;text-align:left;color:#6B5200}
.demo-box b{color:var(--ink)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand img{width:46px;height:46px}
.brand b{font-family:var(--font-h);font-size:18px;display:block;line-height:1.1;color:var(--pri)}
.brand span{font-size:12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;font-weight:700;color:var(--ink-2);text-align:left;width:100%}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:var(--pri-50);color:var(--pri)}
.nav-item.on{background:var(--pri);color:#fff}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.nav-item.on .cnt{background:#fff;color:var(--red)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 26px;position:sticky;top:0;z-index:20;background:rgba(244,247,252,.9);backdrop-filter:blur(8px)}
.topbar h2{font-size:22px}
.topbar .menu-btn,.topbar .home-btn,.mobile-only{display:none!important}
.content{padding:6px 26px 40px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%}
.user-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-family:var(--font-h);font-weight:700;color:var(--ink);font-size:14px;flex-shrink:0}
.mode-flag{position:fixed;bottom:12px;right:12px;pointer-events:none;z-index:80;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;opacity:.9}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(20,33,61,.35);z-index:55}
  .topbar{padding:12px 16px}
  .topbar .menu-btn,.topbar .home-btn{display:inline-grid!important}
  .nav-item.mobile-only{display:flex!important}
  .topbar h2{font-size:19px}
  .user-pill .nm{display:none}
  .content{padding:4px 16px 40px}
}

/* ---------- home hero + tiles (seperti brief) ---------- */
.hero{background:var(--pri);color:#fff;border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero img{width:84px;height:84px;flex-shrink:0;border-radius:50%;box-shadow:0 0 0 4px #fff;position:relative;z-index:1}
.hero h2{color:#fff;font-size:23px}
.hero p{color:#fff;opacity:.88}
.hero:after{content:"";position:absolute;right:-34px;top:-38px;width:150px;height:150px;border-radius:50%;background:var(--yellow);opacity:.95}
.hero:before{content:"";position:absolute;right:70px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .avatar{background:var(--yellow);color:var(--ink)}
.hero .badge{background:rgba(255,255,255,.18);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-align:center;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile svg{width:30px;height:30px;color:var(--pri-d)}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{padding:13px 6px;font-size:12.5px;line-height:1.25}.tile svg{width:25px;height:25px}.hero{padding:16px;gap:12px}.hero img{width:56px;height:56px}.hero h2{font-size:19px}.hero p{font-size:13.5px}.hero:after{width:80px;height:80px;right:-36px;top:-36px}.hero:before{display:none}}
.tiles.desktop-hide{display:none}
@media(max-width:900px){.tiles.desktop-hide{display:grid}}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .meta{min-width:0;flex:1}
.li .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:600}

/* status segmented (absensi) */
.seg{display:inline-flex;background:#EDF2F8;border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:38px;padding:6px 9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on.H{background:var(--green);color:#fff}
.seg button.on.I{background:var(--blue);color:#fff}
.seg button.on.S{background:var(--orange);color:#fff}
.seg button.on.A{background:var(--red);color:#fff}

/* jadwal */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.days{grid-template-columns:1fr}}
.day{border-radius:18px;padding:14px;background:#fff;box-shadow:var(--shadow)}
.day h4{font-size:16px;padding:6px 12px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center}
.sess{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sess:hover{border-color:var(--pri-100)}
.sess .time{font-weight:800;font-size:13px}

/* rekap grid */
.cell-ok{color:#0E7A41;font-weight:800}
.cell-no{color:#B4282D;font-weight:800;background:var(--red-50)}
.cell-na{color:#C9C5D6}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:22px;width:100%;max-width:560px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:19px;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(244,247,252,.6);z-index:150}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--pri-100);border-top-color:var(--pri);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* invoice preview */
.inv{font-family:var(--font-b);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.inv-h{display:flex;gap:12px;align-items:center;border-bottom:2px dashed var(--pri-100);padding-bottom:14px;margin-bottom:14px}
.inv-h img{width:64px;height:64px}
.inv-h h2{font-size:20px;color:var(--pri)}
.inv table{width:100%;border-collapse:collapse;font-size:14px}
.inv td{padding:6px 0;vertical-align:top}
.inv .tot{font-family:var(--font-h);font-size:24px;color:var(--pri)}
.stamp{position:absolute;right:18px;top:92px;transform:rotate(-12deg);border:3px solid;border-radius:10px;padding:4px 12px;font-family:var(--font-h);font-weight:700;font-size:20px;letter-spacing:1px;opacity:.85}
.stamp.paid{color:var(--green);border-color:var(--green)}
.stamp.unpaid{color:var(--red);border-color:var(--red)}

/* ---------- murid ---------- */
.kid-top{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:880px;margin:0 auto;width:100%}
.kid-top img{width:48px;height:48px}
.kid-wrap{max-width:880px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px;width:100%}
.star-pill{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);border-radius:999px;padding:6px 14px;font-family:var(--font-h);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--yellow-d)}
.kid-hero{border-radius:26px;padding:22px;background:linear-gradient(135deg,var(--pri) 0%,#2F6FD0 100%);color:#fff;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.kid-hero h2{font-size:26px}
.kid-hero .lv{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}
.kid-hero .big-emoji{font-size:60px;line-height:1}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:560px){.levels{grid-template-columns:1fr}}
.level-card{border-radius:22px;padding:18px;text-align:left;display:flex;gap:14px;align-items:center;transition:transform .12s;position:relative;border:2.5px solid transparent}
.level-card:hover{transform:translateY(-2px)}
.level-card .n{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-family:var(--font-h);font-size:30px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.level-card h3{font-size:18px}
.level-card p{font-size:13px;color:var(--ink-2)}
.level-card.locked{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.level-card .lock{position:absolute;right:14px;top:12px;font-size:18px}
.quiz{background:#fff;border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-width:460px;margin:0 auto;width:100%}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:9px;background:#E4EBF5}
.dots i.ok{background:var(--green)} .dots i.no{background:var(--red)} .dots i.cur{background:var(--yellow)}
.q-box{text-align:center;padding:18px 8px;border-radius:20px;background:var(--yellow-50)}
.q-text{font-family:var(--font-h);font-size:22px;font-weight:600;color:var(--ink);line-height:1.35;white-space:pre-line}
.q-ans{margin-top:8px;font-family:var(--font-h);font-size:38px;font-weight:700;min-height:52px;color:var(--pri);background:#fff;border-radius:14px;border:2.5px dashed var(--pri-100);padding:2px 10px}
.q-box.right{background:var(--green-50)} .q-box.wrong{background:var(--red-50);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{height:58px;border-radius:16px;background:#fff;border:2px solid var(--line);font-family:var(--font-h);font-size:26px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.keypad button:active{transform:translateY(2px);box-shadow:none}
.keypad .ok{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 0 #0E7A41}
.keypad .del{background:var(--pri-50);color:var(--pri-d)}
.result{text-align:center;padding:10px}
.result .stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.result .stars span{display:inline-block;animation:starpop .5s both}
.result .stars span.off{filter:grayscale(1);opacity:.25}
@keyframes starpop{from{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.3)}}
.score-big{font-family:var(--font-h);font-size:64px;color:var(--pri);font-weight:700;line-height:1}

/* print */
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}
}

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const DEMO = !IS_GAS && !CONFIG.API_URL;

const S = { token: null, role: null, profile: null, db: {}, settings: {}, me: null, page: null, tab: {}, f: {} };

/* ---------------- storage aman ---------------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------------- API ---------------- */
async function call(action, payload = {}, opts = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (!opts.silent) loading(true);
  try {
    let res;
    if (IS_GAS) {
      res = await new Promise((ok, ko) => google.script.run.withSuccessHandler(r => ok(JSON.parse(r))).withFailureHandler(ko).api(JSON.stringify(req)));
    } else if (DEMO) {
      await new Promise(r => setTimeout(r, 120));
      res = Mock.handle(JSON.parse(JSON.stringify(req)));
    } else {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(req) });
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'SESSION') { logout(true); }
      throw new Error(res.message || res.error || 'Terjadi kesalahan');
    }
    return res;
  } finally { if (!opts.silent) loading(false); }
}

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => { n = Number(n) || 0; return (n < 0 ? '−Rp' : 'Rp') + Math.abs(n).toLocaleString('id-ID'); };
const pad = n => String(n).padStart(2, '0');
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const thisPeriod = () => todayStr().slice(0, 7);
const fmtDate = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return d ? `${+d} ${BULAN[+m - 1].slice(0, 3)} ${y}` : s; };
const fmtDateLong = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return `${+d} ${BULAN[+m - 1]} ${y}`; };
const fmtPeriod = p => { if (!p) return '-'; const [y, m] = p.split('-'); return `${BULAN[+m - 1]} ${y}`; };
const addMonths = (p, n) => { let [y, m] = p.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const dayName = s => HARI[new Date(s + 'T00:00:00').getDay()];
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const rand4 = () => String(Math.floor(1000 + Math.random() * 9000));
function waNum(n) { n = String(n || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); else if (n.startsWith('8')) n = '62' + n; return n; }
function waLink(n, text) { return `https://wa.me/${waNum(n)}?text=${encodeURIComponent(text)}`; }
function openWa(n, text) { if (!waNum(n)) return toast('Nomor WhatsApp belum diisi', true); window.open(waLink(n, text), '_blank'); }
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = String(v).trim()); return o; }
function monthOptions(sel, back = 12, fwd = 1) {
  const cur = thisPeriod(); let out = '';
  for (let i = fwd; i >= -back; i--) { const p = addMonths(cur, i); out += `<option value="${p}" ${p === sel ? 'selected' : ''}>${fmtPeriod(p)}</option>`; }
  return out;
}
function downloadFile(name, content, type = 'text/csv;charset=utf-8') {
  try {
    const blob = new Blob(['﻿' + content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast('Unduhan tidak didukung di tampilan ini', true); }
}
function toCSV(rows) { return rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n'); }

/* ---------------- UI primitives ---------------- */
let toastT;
function toast(msg, err) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2800);
}
let loadingN = 0;
function loading(on) {
  loadingN += on ? 1 : -1; if (loadingN < 0) loadingN = 0;
  let l = $('#loading'); if (!l) { l = document.createElement('div'); l.id = 'loading'; l.className = 'loading hidden'; l.innerHTML = '<div class="spin"></div>'; document.body.appendChild(l); }
  l.classList.toggle('hidden', loadingN === 0);
}
function modal(title, body, foot = '', wide = false) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal-bg'; m.id = 'modal';
  m.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
  const f = m.querySelector('input:not([type=hidden]),select,textarea'); if (f && window.innerWidth > 700) setTimeout(() => f.focus(), 50);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function confirmBox(msg, onYes, yesLabel = 'Ya, hapus') {
  window.__yes = () => { closeModal(); onYes(); };
  modal('Konfirmasi', `<p>${msg}</p>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn red" onclick="__yes()">${yesLabel}</button>`);
}
function printHtml(inner, title = 'Cetak') {
  const css = $('style').outerHTML;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">${css}<style>body{background:#fff;padding:24px}@media print{body{padding:0}.inv{border:0}}</style></head><body><div style="max-width:720px;margin:0 auto">${inner}</div><script>setTimeout(function(){window.print()},700)<\/script></body></html>`;
  const w = window.open('', '_blank');
  if (w) { w.document.open(); w.document.write(html); w.document.close(); }
  else {
    const d = document.createElement('div'); d.className = 'print-area'; d.innerHTML = inner; document.body.appendChild(d);
    window.print(); setTimeout(() => d.remove(), 500);
  }
}

let _lvKey = null, _lvVal = null;
function LV() {

}
const lvOf = n => LV()[Math.min(LV().length, Math.max(1, +n || 1)) - 1];
const LETTERS = ['A', 'B', 'C', 'D', 'E'];
const optsOf = s => String(s.pilihan || '').split('|').map(x => x.trim()).filter(Boolean);
function buildQuiz(level, bank, jurus, n) {

  const pool = (bank || []).filter(s => String(s.level) === String(level) && s.aktif !== 'Tidak' && (!jurus || s.jurus === jurus)).sort(() => Math.random() - .5);
  return pool.slice(0, n).map(s => { const o = optsOf(s); return { q: s.soal, ans: String(s.jawaban).trim(), opts: o.length >= 2 ? o : null }; });
}
/* cocokkan jawaban isian: tidak peka huruf besar/kecil & tanda baca akhir; beberapa jawaban benar dipisah ; */
const normAns = t => String(t).toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, ' ').replace(/[.!?,]+$/, '').trim();
function cekJawaban(input, it) {
  if (it.opts) return String(input).toUpperCase() === String(it.ans).toUpperCase();
  return String(it.ans).split(';').map(normAns).filter(Boolean).includes(normAns(input));
}
function ansLabel(it) { if (!it.opts) return String(it.ans).split(';')[0].trim(); const i = LETTERS.indexOf(String(it.ans).toUpperCase()); return i > -1 ? `${LETTERS[i]}. ${it.opts[i] || ''}` : it.ans; }
/* baca 1 baris soal: "Soal | opsi A | opsi B | opsi C | opsi D | jawaban"  atau  "Soal = jawaban" */
function parseSoalLine(line) {
  const parts = line.split('|').map(x => x.trim());
  if (parts.length >= 4) {
    const soal = parts[0], opts = parts.slice(1, -1).filter(Boolean).slice(0, 5); let a = parts[parts.length - 1];
    if (/^[A-Ea-e]$/.test(a)) a = a.toUpperCase(); else { const i = opts.findIndex(o => normAns(o) === normAns(a)); a = i > -1 ? LETTERS[i] : ''; }
    if (!soal || opts.length < 2 || !a || LETTERS.indexOf(a) >= opts.length) return null;
    return { soal, pilihan: opts.join(' | '), jawaban: a };
  }
  const k = line.lastIndexOf('=');
  if (k > 0) { const soal = line.slice(0, k).trim(), jawaban = line.slice(k + 1).trim(); if (soal && jawaban) return { soal, pilihan: '', jawaban }; }
  return null;
}

async function doLogin(e) {

    S.token = r.token; S.role = r.role; S.profile = r.profile;
    store.set('adg_session', { token: r.token, role: r.role, profile: r.profile });
    await startApp();
  } catch (err) { toast(err.message, true); }
}

}

  else { const r = await call('me'); S.me = r.data; S.settings = r.data.settings; renderOrtu(); }

}

/* ---------- data helpers ---------- */
const D = t => S.db[t] || (S.db[t] = []);
const siswaById = id => D('Siswa').find(s => s.id === id) || { id, nama: '(terhapus)' };
const guruById = id => D('Guru').find(g => g.id === id) || { id, nama: '-' };
const siswaAktif = () => D('Siswa').filter(s => s.status === 'Aktif').sort((a, b) => a.nama.localeCompare(b.nama));
const paysOf = sid => D('SPP').filter(x => x.siswaId === sid && isSpp(x)).sort((a, b) => (a.tanggalBayar || '').localeCompare(b.tanggalBayar || ''));
const sesiOf = sid => sesiCalc(D('SPP').filter(x => x.siswaId === sid), D('Absensi').filter(a => a.siswaId === sid), S.settings);
const nextInfo = s => { const i = sesiOf(s.id); return { sesi: sesiPaket(s, S.settings), sisa: i.sisa, no: invoiceNo(s.id, thisPeriod(), 'SPP', paysOf(s.id).length + 1) }; };
const regOf = sid => D('SPP').find(x => x.siswaId === sid && isReg(x));
const regUnpaid = () => siswaAktif().filter(s => !regOf(s.id));
const ltBelum = () => D('SPP').filter(x => isLT(x) && !isPaid(x) && siswaById(x.siswaId).status !== 'Berhenti');
/* pemasukan = semua pembayaran yang sudah dibayar, dihitung dari bulan tanggal bayar */
const incomeRows = p => D('SPP').filter(x => isPaid(x) && String(x.tanggalBayar).startsWith(p)).sort((a, b) => a.tanggalBayar.localeCompare(b.tanggalBayar));
const gajiRows = p => D('Guru').filter(g => g.status !== 'Nonaktif' || D('AbsensiGuru').some(a => a.guruId === g.id && a.tanggal.startsWith(p))).map(g => ({ g, c: gajiCalc(g, p) }));
function keuangan(p) { const inc = incomeRows(p), gj = gajiRows(p); const masuk = sum(inc, x => x.nominal), gaji = sum(gj, r => r.c.total); return { inc, gj, masuk, gaji, bersih: masuk - gaji }; }
/* siswa aktif yang perlu ditagih (sisa sesi ≤ batas) — diurutkan dari yang paling mendesak */
const perluTagih = () => siswaAktif().map(s => ({ s, i: sesiOf(s.id) })).filter(x => x.i.status !== 'aman').sort((a, b) => a.i.sisa - b.i.sisa);
function starTotal(sid, list = D('Bintang')) { return sum(list.filter(b => b.siswaId === sid), b => b.jumlah); }
function absMonth(sid, p, list = D('Absensi')) {
  const rows = list.filter(a => a.siswaId === sid && String(a.tanggal).startsWith(p));
  const c = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 }; rows.forEach(r => c[r.status] = (c[r.status] || 0) + 1);
  return { ...c, total: rows.length, rows };
}
function replaceRows(t, rows) { rows.forEach(r => { const i = D(t).findIndex(x => x.id === r.id); i > -1 ? D(t)[i] = r : D(t).push(r); }); }
async function saveRow(t, row) { const r = await call('save', { table: t, row }); replaceRows(t, [r.row]); return r.row; }
async function saveRows(t, rows) { const r = await call('saveMany', { table: t, rows }); replaceRows(t, r.rows); return r.rows; }
async function removeRow(t, id) { await call('remove', { table: t, id }); S.db[t] = D(t).filter(x => x.id !== id); }

const kls = j => j === 'Reguler' ? 'Grup' : j;
const jkBadge = j => j ? `<span class="badge ${j === 'Privat' ? 'b-purple' : 'b-yellow'}">${esc(kls(j))}</span>` : '';
const fotoOr = (x, size = 40, bg = '') => x && x.foto ? `<img class="photo" src="${x.foto}" style="width:${size}px;height:${size}px" alt="">` : `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px;${bg}">${initials(x && x.nama)}</div>`;

    </div></div>`;

let _xlsxP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return _xlsxP || (_xlsxP = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => { _xlsxP = null; ko(new Error('modul Excel gagal dimuat')); }; document.head.appendChild(s); }));
}
/* sheets: [{ name, rows: [[...]], cols: [lebar kolom] }] → file .xlsx (cadangan: .csv) */
async function downloadXlsx(name, sheets) {
  loading(true);
  try {
    const X = await loadXLSX(); const wb = X.utils.book_new();
    sheets.forEach(sh => { const ws = X.utils.aoa_to_sheet(sh.rows); if (sh.cols) ws['!cols'] = sh.cols.map(w => ({ wch: w })); X.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31)); });
    X.writeFile(wb, name); toast('File Excel diunduh ✓');
  } catch (e) { toast('Excel tidak tersedia, diunduh sebagai CSV', true); downloadFile(name.replace(/\.xlsx$/, '.csv'), sheets.map(s => toCSV([[s.name]].concat(s.rows))).join('\n\n')); }
  finally { loading(false); }
}
function dlKeuangan(p) {
  const K = keuangan(p), st = S.settings;
  const by = j => sum(K.inc.filter(x => (x.jenis || 'SPP') === j), x => x.nominal);
  const ring = [[`Laporan Keuangan ${st.namaLembaga} — ${fmtPeriod(p)}`], [],
    ['Keterangan', 'Jumlah (Rp)'],
    ['Pemasukan SPP (paket sesi)', by('SPP')], ['Pemasukan biaya pendaftaran', by('Pendaftaran')], ['Pemasukan biaya level test', by('Level Test')],
    ['TOTAL PEMASUKAN', K.masuk], [], ['Total gaji tutor', K.gaji], [], ['PEMASUKAN BERSIH (pemasukan − gaji tutor)', K.bersih], [],
    ['Jumlah transaksi', K.inc.length], ['Dicetak', fmtDateLong(todayStr())]];
  const inc = [['Tanggal bayar', 'No. kwitansi', 'ID siswa', 'Nama siswa', 'Program', 'Jenis', 'Sesi', 'Metode', 'Catatan', 'Nominal (Rp)']]
    .concat(K.inc.map(x => { const s = siswaById(x.siswaId); return [x.tanggalBayar, x.noInvoice, x.siswaId, s.nama, lvOf(s.level).nama, x.jenis || 'SPP', isSpp(x) ? +(x.sesi || st.sesiPerPaket || 4) : '', x.metode, x.catatan, +x.nominal || 0]; }))
    .concat([['', '', '', '', '', '', '', '', 'TOTAL', K.masuk]]);
  const gj = [['ID', 'Tutor', 'Hari hadir', 'Jam mengajar', 'Tarif per jam (Rp)', 'Gaji pokok (Rp)', 'Bonus (Rp)', 'Potongan (Rp)', 'Total gaji (Rp)', 'Status', 'Tanggal bayar']]
    .concat(K.gj.map(({ g, c }) => [g.id, g.nama, c.hadir, c.jam, c.tarif, c.pokok, c.bonus, c.pot, c.total, c.paid ? 'Dibayar' : 'Belum dibayar', c.rec ? c.rec.tanggalBayar : '']))
    .concat([['', 'TOTAL', '', sum(K.gj, r => r.c.jam), '', '', '', '', K.gaji, '', '']]);
  downloadXlsx(`Keuangan-${st.namaLembaga}-${p}.xlsx`, [
    { name: 'Ringkasan', rows: ring, cols: [44, 18] },
    { name: 'Pemasukan', rows: inc, cols: [13, 22, 9, 24, 14, 12, 6, 10, 24, 14] },
    { name: 'Gaji Tutor', rows: gj, cols: [6, 24, 10, 12, 16, 15, 12, 13, 15, 14, 13] }
  ]);
}

function fotoField(cur) {

/* foto dikecilkan & dipotong persegi 200px → disimpan sebagai teks di Google Sheet */
function pickFoto(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  const form = inp.closest('form'); const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => {
    const N = 200, c = document.createElement('canvas'); c.width = c.height = N;
    const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, N, N); x.drawImage(img, sx, sy, m, m, 0, 0, N, N);
    const url = c.toDataURL('image/jpeg', .72);
    form.querySelector('[name=foto]').value = url;
    form.querySelector('#fotoPrev').innerHTML = `<img class="photo" src="${url}" style="width:64px;height:64px">`;
  }; img.onerror = () => toast('File bukan gambar', true); img.src = rd.result; };
  rd.readAsDataURL(file);
}

function batalLT(id) { confirmBox('Batalkan status lunas? Tagihan kembali menjadi belum bayar.', async () => { const x = D('SPP').find(r => r.id === id); await saveRow('SPP', { ...x, tanggalBayar: '', metode: '' }); toast('Status dibatalkan'); renderAdmin(); }, 'Ya, batalkan'); }
/* invoice: payId diisi → kwitansi pembayaran itu; kosong → invoice tagihan (paket berikutnya / pendaftaran) */
function invData(sid, jenis = 'SPP', payId = '') {
  const s = siswaById(sid);
  const row = payId ? D('SPP').find(r => r.id === payId) : jenis === 'Pendaftaran' ? regOf(sid) : null;
  const x = row && isPaid(row) ? row : null;
  const info = jenis === 'Level Test' && row ? { nominal: row.nominal, no: row.noInvoice, ket: row.catatan } : jenis === 'Pendaftaran' ? {} : nextInfo(s);
  return { s, x, per: row ? row.periode : (jenis === 'Pendaftaran' ? (s.tglMulai || todayStr()).slice(0, 7) : thisPeriod()), info };
}
function showInvoice(sid, jenis = 'SPP', payId = '') {
  const { s, x, per, info } = invData(sid, jenis, payId);
  modal(x ? 'Kwitansi Pembayaran' : `Invoice ${jenis === 'Pendaftaran' ? 'Biaya Pendaftaran' : jenis === 'Level Test' ? 'Biaya Level Test' : 'SPP Paket Berikutnya'}`, invoiceHtml(s, per, x, S.settings, jenis, info),
    `<button class="btn ghost" onclick="printHtml($('#modal .inv').outerHTML,'${x ? 'Kwitansi' : 'Invoice'} ${esc(s.nama)}')">${ic('print')} Cetak / PDF</button>
     <button class="btn wa" onclick="waInvoice('${sid}','${jenis}','${x ? x.id : ''}')">${ic('wa')} Kirim WA</button>
     ${x ? '' : jenis === 'Level Test' ? (payId ? `<button class="btn green" onclick="bayarLT('${payId}')">Catat Bayar</button>` : '') : `<button class="btn green" onclick="formBayar('${sid}','${jenis}')">Catat Bayar</button>`}`, true);
}
function waInvoice(sid, jenis = 'SPP', payId = '') { const { s, x, per, info } = invData(sid, jenis, payId); openWa(s.waOrtu, invoiceWaText(s, per, x, S.settings, jenis, info)); }

async function saveBayar() {
  const f = formData($('#fBayar'));
  if (!f.siswaId) return toast('Pilih siswa', true);
  if (f.jenis === 'Pendaftaran' && regOf(f.siswaId)) return toast('Biaya pendaftaran siswa ini sudah lunas', true);
  f.nominal = String(f.nominal).replace(/\D/g, '') || '0';
  f.periode = (f.tanggalBayar || todayStr()).slice(0, 7);
  if (f.jenis !== 'Pendaftaran') { f.sesi = String(f.sesi || '').replace(/\D/g, ''); if (!+f.sesi) return toast('Isi jumlah sesi', true); }
  f.noInvoice = invoiceNo(f.siswaId, f.periode, f.jenis, f.jenis === 'Pendaftaran' ? 0 : paysOf(f.siswaId).length + 1);
  try { const r = await saveRow('SPP', f); toast(f.jenis === 'Pendaftaran' ? 'Pembayaran tersimpan ✓' : `Pembayaran tersimpan ✓ · +${f.sesi} sesi`); renderAdmin(); showInvoice(f.siswaId, f.jenis, r.id); } catch (e) { toast(e.message, true); }
}
function delBayar(id) { confirmBox('Batalkan/hapus catatan pembayaran ini? Sesi dari pembayaran ini ikut dibatalkan.', async () => { await removeRow('SPP', id); toast('Pembayaran dihapus'); renderAdmin(); }); }
function sppRekap() {
  const y = S.f.sppY || thisPeriod().slice(0, 4);
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`);
  const pays = D('SPP').filter(x => isPaid(x) && String(x.tanggalBayar).startsWith(y)).map(x => Object.assign({}, x, { periode: x.tanggalBayar.slice(0, 7) }));
  const list = D('Siswa').filter(s => s.status === 'Aktif' || pays.some(x => x.siswaId === s.id)).sort((a, b) => a.nama.localeCompare(b.nama));
  const body = list.map(s => {
    let tot = 0;
    const cells = months.map(m => { const ps = pays.filter(x => x.siswaId === s.id && x.periode === m); if (!ps.length) return `<td class="c cell-na">·</td>`; const t = sum(ps, x => x.nominal); tot += t; const ss = sum(ps.filter(isSpp), x => x.sesi); return `<td class="c cell-ok" title="${ps.map(x => `${fmtDate(x.tanggalBayar)} · ${isSpp(x) ? (x.sesi || '') + ' sesi' : x.jenis} · ${rp(x.nominal)}`).join('\n')}">${ss ? '+' + ss : '✓'}</td>`; }).join('');
    return `<tr><td class="nowrap"><b>${esc(s.nama)}</b></td>${cells}<td class="r num">${tot ? rp(tot) : '-'}</td><td>${s.status === 'Aktif' ? sesiBadge(sesiOf(s.id)) : ''}</td></tr>`;
  }).join('');
  const perBulan = months.map(m => sum(pays.filter(x => x.periode === m), x => x.nominal));
  return `<div class="grid g3"><div class="stat bg-green"><span class="lbl">Pemasukan tahun ${y}</span><span class="val num">${rp(sum(pays, x => x.nominal))}</span><span class="sub">${pays.length} pembayaran</span></div>
    <div class="stat bg-blue"><span class="lbl">Pemasukan bulan ini</span><span class="val num">${rp(perBulan[+thisPeriod().slice(5) - 1] || 0)}</span><span class="sub">${fmtPeriod(thisPeriod())}</span></div>
    <div class="stat bg-yellow"><span class="lbl">Perlu ditagih</span><span class="val num">${perluTagih().length}</span><span class="sub">siswa</span></div></div>
  <div class="card"><div class="card-head"><select class="input" style="max-width:130px" onchange="setF('sppY',this.value)">${[+y - 1, +y, +y + 1].map(v => `<option ${v == y ? 'selected' : ''}>${v}</option>`).join('')}</select><span class="small muted">angka = jumlah sesi dibayar di bulan itu · ✓ = pendaftaran / level test</span><div class="spacer"></div><button class="btn ghost" onclick="csvSpp('${y}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th>${months.map(m => `<th class="c">${BULAN[+m.slice(5) - 1].slice(0, 3)}</th>`).join('')}<th class="r">Total</th><th>Sisa sesi</th></tr></thead><tbody>${body || '<tr><td colspan="15"><div class="empty">Belum ada data</div></td></tr>'}
  <tr><td><b>Total</b></td>${perBulan.map(v => `<td class="c small num"><b>${v ? Math.round(v / 1000) + 'rb' : '-'}</b></td>`).join('')}<td class="r num"><b>${rp(sum(pays, x => x.nominal))}</b></td><td></td></tr></tbody></table></div></div>`;
}
function csvSpp(y) {
  const rows = [['Tanggal', 'No. Kwitansi', 'ID', 'Siswa', 'Jenis', 'Sesi', 'Nominal', 'Metode', 'Catatan']];
  D('SPP').filter(x => isPaid(x) && String(x.tanggalBayar).startsWith(y)).sort((a, b) => (a.tanggalBayar || '').localeCompare(b.tanggalBayar || '')).forEach(x => rows.push([x.tanggalBayar, x.noInvoice, x.siswaId, siswaById(x.siswaId).nama, x.jenis || 'SPP', x.sesi, x.nominal, x.metode, x.catatan]));
  rows.push([]); rows.push(['ID', 'Siswa', 'Program', 'Sesi dibayar', 'Sesi terpakai', 'Sisa sesi']);
  siswaAktif().forEach(s => { const i = sesiOf(s.id); rows.push([s.id, s.nama, lvOf(s.level).nama, i.beli, i.pakai, i.sisa]); });
  downloadFile(`Pembayaran-Sesi-${y}.csv`, toCSV(rows));
}
function sppRiwayat() {
  const q = (S.f.rq || '').toLowerCase();

  return `<div class="card"><div class="card-head"><input class="input" style="max-width:240px" placeholder="Cari nama siswa…" value="${esc(S.f.rq || '')}" onchange="setF('rq',this.value)"><div class="spacer"></div><span class="muted small">${rows.length} transaksi · ${rp(sum(rows, x => x.nominal))}</span></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Tanggal</th><th>No. Kwitansi</th><th>Siswa</th><th>Jenis</th><th class="c">Sesi</th><th>Metode</th><th class="r">Nominal</th><th></th></tr></thead><tbody>
  ${rows.slice(0, 300).map(x => `<tr><td class="nowrap">${fmtDate(x.tanggalBayar)}</td><td class="small num">${esc(x.noInvoice)}</td><td><b>${esc(siswaById(x.siswaId).nama)}</b></td><td>${jenisBadge(x)}</td><td class="c num">${isSpp(x) ? '+' + esc(x.sesi || S.settings.sesiPerPaket || 4) : '-'}</td><td>${esc(x.metode)}</td><td class="r num"><b>${rp(x.nominal)}</b></td><td class="nowrap"><button class="icon-btn" onclick="showInvoice('${x.siswaId}','${x.jenis || 'SPP'}','${x.id}')">${ic('file')}</button><button class="icon-btn" onclick="delBayar('${x.id}')">${ic('trash')}</button></td></tr>`).join('') || '<tr><td colspan="8"><div class="empty">Belum ada pembayaran</div></td></tr>'}
  </tbody></table></div></div>`;
}

/* ================= LAPORAN BULANAN ================= */
function lapAuto(s, p) {
  const c = absMonth(s.id, p);
  const n = D('Nilai').filter(x => x.siswaId === s.id && x.tanggal.startsWith(p));
  const b = sum(D('Bintang').filter(x => x.siswaId === s.id && x.tanggal.startsWith(p) && +x.jumlah > 0), x => x.jumlah);
  return { level: s.level, hadir: String(c.Hadir), pertemuan: String(c.total || S.settings.pertemuanPerBulan || 4), rataNilai: n.length ? String(Math.round(sum(n, x => x.skor) / n.length)) : '', bintang: String(b), skill: '', target: '' };
}
const skillObj = l => { try { const o = JSON.parse(l.skill || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } };

/* ================= REKAP GAJI GURU ================= */
function gajiCalc(g, p) {
  const r = D('AbsensiGuru').filter(a => a.guruId === g.id && a.tanggal.startsWith(p));
  const hadir = r.filter(x => x.status === 'Hadir').length, jam = sum(r, x => x.jamMengajar);
  const tarif = +g.tarif || 0, tipe = 'Per jam';
  const pokok = Math.round(tarif * jam); // gaji tutor dihitung per jam mengajar
  const rec = D('Gaji').find(x => x.guruId === g.id && x.periode === p);
  const bonus = +(rec && rec.bonus) || 0, pot = +(rec && rec.potongan) || 0;
  return { hadir, izin: r.filter(x => x.status !== 'Hadir').length, jam, tarif, tipe, pokok, bonus, pot, total: pokok + bonus - pot, rec, paid: !!(rec && rec.tanggalBayar) };
}
function pgGaji() {
  const p = S.f.gjP || thisPeriod();
  const rows = D('Guru').filter(g => g.status !== 'Nonaktif' || D('AbsensiGuru').some(a => a.guruId === g.id && a.tanggal.startsWith(p))).map(g => ({ g, c: gajiCalc(g, p) }));
  const tot = sum(rows, r => r.c.total), paid = sum(rows.filter(r => r.c.paid), r => r.c.total);
  return `<div class="grid g3">
    <div class="stat bg-blue"><span class="lbl">Total gaji ${fmtPeriod(p)}</span><span class="val num">${rp(tot)}</span><span class="sub">${rows.length} guru</span></div>
    <div class="stat bg-green"><span class="lbl">Sudah dibayar</span><span class="val num" style="color:#0E7A41">${rp(paid)}</span><span class="sub">${rows.filter(r => r.c.paid).length} guru</span></div>
    <div class="stat bg-red"><span class="lbl" style="color:#B4282D">Belum dibayar</span><span class="val num" style="color:var(--red)">${rp(tot - paid)}</span><span class="sub">${rows.filter(r => !r.c.paid).length} guru</span></div></div>
  <div class="card"><div class="card-head"><select class="input" style="max-width:200px" onchange="setF('gjP',this.value)">${monthOptions(p)}</select><span class="small muted">Jam mengajar (menu Kehadiran Guru) × tarif per jam di Data Guru</span><div class="spacer"></div><button class="btn ghost" onclick="csvGaji('${p}')">${ic('download')} Unduh Excel (CSV)</button></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Guru</th><th>Tarif/jam</th><th class="c">Hadir</th><th class="c">Jam</th><th class="r">Gaji pokok</th><th class="r">Bonus</th><th class="r">Potongan</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(({ g, c }) => `<tr class="${c.paid ? '' : 'unpaid'}"><td><b>${esc(g.nama)}</b><div class="small muted">${esc(g.id)}</div></td>
    <td class="small nowrap">${rp(c.tarif)}</td><td class="c num">${c.hadir}</td><td class="c num">${c.jam}</td>

let Q = null;
function startQuiz(level, jurus) {
  const items = buildQuiz(level, S.me.Soal, jurus || '');
  if (!items.length) return toast('Soal untuk pilihan ini belum disiapkan admin', true);
  Q = { level, jurus: jurus || '', items, i: 0, ans: '', res: [], t0: Date.now(), lock: false };
  renderQuiz();
  clearInterval(Q.timer); Q.timer = setInterval(() => { const el = $('#qTimer'); if (el && Q) el.textContent = fmtSec((Date.now() - Q.t0) / 1000); else if (Q) clearInterval(Q.timer); }, 1000);
}
const fmtSec = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function renderQuiz(state = '', picked = '') {
  const it = Q.items[Q.i], L = lvOf(Q.level);
  const correct = it.opts ? String(it.ans).toUpperCase() : '';
  $('#app').innerHTML = kidTop(L.nama + (Q.jurus ? ' · ' + Q.jurus : '')) + `<div class="kid-wrap"><div class="quiz">
    <div class="row"><button class="btn sm ghost" onclick="quitQuiz()">✕ Keluar</button><div class="spacer"></div><b>Soal ${Q.i + 1}/${Q.items.length}</b><div class="spacer"></div><span class="badge b-pri" style="font-size:14px">⏱ <span id="qTimer">${fmtSec((Date.now() - Q.t0) / 1000)}</span></span></div>
    <div class="dots">${Q.items.map((_, k) => `<i class="${k < Q.res.length ? (Q.res[k] ? 'ok' : 'no') : k === Q.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="q-box ${state}"><div class="q-text">${esc(it.q)}</div>
      ${state === 'wrong' ? `<div style="margin-top:8px;font-weight:800;color:var(--red)">Jawaban yang benar: ${esc(ansLabel(it))}</div>` : state === 'right' ? '<div style="margin-top:8px;font-weight:800;color:var(--green)">Great job! Benar 🎉</div>' : ''}</div>
    ${it.opts ? `<div class="mc">${it.opts.map((o, k) => { const L2 = LETTERS[k]; const cls = state ? (L2 === correct ? 'right' : L2 === picked ? 'wrong' : '') : ''; return `<button class="${cls}" onclick="qPick('${L2}')"><b>${L2}</b><span>${esc(o)}</span></button>`; }).join('')}</div>`
      : `<form class="row" onsubmit="event.preventDefault();qPick(this.a.value)"><input class="input" name="a" id="qAns" autocomplete="off" autocapitalize="off" placeholder="Tulis jawaban…" style="flex:1;font-size:17px" value="${esc(picked)}" ${state ? 'disabled' : ''}><button class="btn" ${state ? 'disabled' : ''}>Jawab</button></form>`}
  </div></div>`;
  const inp = $('#qAns'); if (inp && !state) inp.focus();
}
function qPick(v) {
  if (!Q || Q.lock) return;
  v = String(v || '').trim(); if (!v) return;
  const ok = cekJawaban(v, Q.items[Q.i]);
  Q.res.push(ok); Q.lock = true;
  renderQuiz(ok ? 'right' : 'wrong', v);
  setTimeout(() => { if (!Q) return; Q.lock = false; Q.i++; Q.i >= Q.items.length ? finishQuiz() : renderQuiz(); }, ok ? 800 : 2000);
}
document.addEventListener('keydown', e => {
  if (!Q || Q.lock || !$('.mc')) return;
  const k = e.key.toUpperCase(); const i = LETTERS.indexOf(k) > -1 ? LETTERS.indexOf(k) : '12345'.indexOf(e.key);
  if (i > -1 && Q.items[Q.i].opts && i < Q.items[Q.i].opts.length) qPick(LETTERS[i]);
});
function quitQuiz() { confirmBox('Keluar dari latihan? Hasil tidak akan disimpan.', () => { if (Q) clearInterval(Q.timer); Q = null; S.tab.ortu = 'latihan'; renderOrtu(); }, 'Ya, keluar'); }
async function finishQuiz() {
  clearInterval(Q.timer);
  const benar = Q.res.filter(Boolean).length, total = Q.items.length, durasi = Math.round((Date.now() - Q.t0) / 1000);
  const lv = Q.level, jr = Q.jurus;
  let r;
  try { r = (await call('submitQuiz', { level: lv, jurus: jr, benar, total, durasi })).result; }
  catch (e) { toast(e.message, true); r = { skor: Math.round(benar / total * 100), bintang: 0, gagal: true }; }
  try { const m = await call('me', {}, { silent: true }); S.me = m.data; } catch (e) {}
  const msg = r.skor === 100 ? 'Perfect! Hebat sekali! 🏆' : r.skor >= 75 ? 'Excellent! Terus berlatih ya! 🎉' : r.skor >= 60 ? 'Good job! Sedikit lagi sempurna 💪' : 'Never give up — ayo coba lagi! 🌈';
  Q = null;
  $('#app').innerHTML = kidTop('Hasil latihan') + `<div class="kid-wrap"><div class="quiz result">
    <h2 style="font-size:24px">Latihan selesai!</h2>
    <div class="stars">${[0, 1, 2].map(i => `<span class="${i < r.bintang ? '' : 'off'}" style="animation-delay:${.15 + i * .2}s">⭐</span>`).join('')}</div>
    <div class="score-big num">${r.skor}</div>
    <p style="font-weight:800">${benar} dari ${total} benar · waktu ${fmtSec(durasi)}</p>
    <p style="font-size:18px;margin:8px 0 6px">${msg}</p>
    ${r.bintang ? `<p class="badge b-yellow" style="font-size:14px">+${r.bintang} bintang masuk ke tabungan!</p>` : '<p class="small muted">Dapatkan skor 60 ke atas untuk mendapat bintang.</p>'}
    ${r.gagal ? '<p class="small" style="color:var(--red)">Hasil belum tersimpan (koneksi). Coba lagi nanti.</p>' : ''}
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" onclick="S.tab.ortu='latihan';renderOrtu()">Kembali</button><button class="btn" onclick="startQuiz(${lv},'${esc(jr)}')">Ulangi</button></div>
  </div></div>`;
}

    const lat = (S.me.Latihan || []).filter(x => x.aktif !== 'Tidak').sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));
    body = `<div class="card" style="background:var(--yellow-50)"><b>📝 Latihan soal Bahasa Inggris</b><p class="small">Latihan dari guru dalam bentuk Google Form. Klik <b>Kerjakan</b> untuk membuka soal.</p></div>
    <div class="card"><h3>Latihan untuk ${esc(s.panggilan || s.nama)}</h3>${lat.map(x => `<div class="li" style="flex-wrap:wrap"><div class="avatar" style="background:var(--pri-50);color:var(--pri)">📝</div><div class="meta" style="min-width:180px"><b>${esc(x.judul)}</b><span class="small muted">${x.tanggal ? fmtDate(x.tanggal) : ''}${x.catatan ? ' · ' + esc(x.catatan) : ''}</span></div><a class="btn sm" href="${esc(x.link)}" target="_blank" rel="noopener">Kerjakan ↗</a></div>`).join('') || '<div class="empty">Belum ada latihan untuk ananda</div>'}</div>`;
  }
  const TABS = [['ringkas', 'Ringkasan'], ['spp', `Sesi & SPP${si.status !== 'aman' || ltB.length ? ' 🔴' : ''}`], ['absen', 'Kehadiran'], ['harian', 'Catatan Guru'], ['latihan', 'Latihan Soal']].concat(FITUR_LAPORAN_ORTU ? [['lap', 'Laporan']] : []);
  $('#app').innerHTML = kidTop('Portal Orang Tua') + `<div class="kid-wrap">
    <div class="hero"><div style="position:relative;z-index:1">${fotoOr(s, 64)}</div><div style="position:relative;z-index:1;min-width:0"><h2>${esc(s.nama)}</h2><p>${esc(s.id)} · ${progLine(s)} · ${stBadge(s.status)}</p></div></div>
    <div class="row"><div class="tabs">${TABS.map(([k, l]) => `<button class="${t === k ? 'on' : ''}" onclick="S.tab.ortu='${k}';renderOrtu()">${l}</button>`).join('')}</div></div>
    ${body}
  </div>`;
}
function ortuWaBayar() {
  const s = S.me.siswa;
  openWa(S.settings.noWa, `Halo admin ${S.settings.namaLembaga}, saya orang tua ${s.nama} (${s.id}) ingin konfirmasi pembayaran SPP. Berikut bukti transfernya:`);
}
function ortuInv(jenis = 'SPP', payId = '') {
  const s = S.me.siswa, st = S.settings;
  const row = payId ? S.me.SPP.find(v => v.id === payId) : jenis === 'Pendaftaran' ? S.me.SPP.find(isReg) : null;
  const x = row && isPaid(row) ? row : null;
  const si = sesiCalc(S.me.SPP, S.me.Absensi, st);
  const info = jenis === 'Level Test' && row ? { nominal: row.nominal, no: row.noInvoice, ket: row.catatan } : jenis === 'Pendaftaran' ? {} : { sesi: sesiPaket(s, st), sisa: si.sisa, no: invoiceNo(s.id, thisPeriod(), 'SPP', si.paket + 1) };
  const per = row ? row.periode : thisPeriod();
  modal(x ? 'Kwitansi Pembayaran' : 'Invoice', invoiceHtml(s, per, x, st, jenis, info), `<button class="btn ghost" onclick="printHtml($('#modal .inv').outerHTML,'${x ? 'Kwitansi' : 'Invoice'} ${esc(s.nama)}')">${ic('print')} Cetak / Simpan PDF</button>${x ? '' : `<button class="btn wa" onclick="ortuWaBayar()">${ic('wa')} Kirim Bukti Bayar</button>`}`, true);
}
function ortuLap(id) {
  const l = S.me.Laporan.find(x => x.id === id), s = S.me.siswa;
  modal('Laporan Bulanan', laporanHtml(s, l, S.settings, S.me.Absensi.filter(a => a.tanggal.startsWith(l.periode))), `<button class="btn" onclick="printHtml($('#modal .inv').outerHTML,'Laporan ${esc(s.nama)}')">${ic('print')} Cetak / Simpan PDF</button>`, true);
}

init();

</script>
</body>
</html>
